events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # kamal-proxy terminates TLS and forwards plain http, so nginx would
        # otherwise build redirect Location: URLs with an http scheme.
        # Emit relative redirects and let the client preserve https.
        absolute_redirect off;

        # Security baseline. `merge` keeps these headers on locations that add
        # their own cache or content-type headers below.
        add_header_inherit merge;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── Health check (Kamal proxy) ──────────────────────
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ── Docs: Ecky IR Field Guide ───────────────────────
        # /docs and /docs/ serve the field guide HTML.
        # /docs/assets/ serves the rendered example images.
        # /docs/ecky-ir.md serves raw markdown for agents/LLMs.
        location = /docs {
            return 301 /docs/;
        }
        # Raw markdown for agents/LLMs — dedicated location so we set the
        # content-type WITHOUT clobbering the inherited mime type map (a
        # nested `types {}` block would reset every type, making the HTML
        # page itself download as application/octet-stream).
        location = /docs/ecky-ir.md {
            alias /usr/share/nginx/html/docs/ecky-ir.md;
            default_type text/markdown;
        }
        location ^~ /docs/examples/ {
            default_type text/plain;
            try_files $uri =404;
        }
        location = /docs/ecky-ir-field-guide.epub {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }
        location = /docs/docs.js {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }
        location /docs/ {
            alias /usr/share/nginx/html/docs/;
            try_files $uri $uri/ /docs/index.html;
        }

        location = /robots.txt {
            default_type text/plain;
            try_files $uri =404;
        }
        location = /sitemap.xml {
            default_type application/xml;
            try_files $uri =404;
        }
        location = /indexnow-key.txt {
            default_type text/plain;
            try_files $uri =404;
        }
        location = /manifest.webmanifest {
            default_type application/manifest+json;
            try_files $uri =404;
        }

        # ── Long-cache immutable assets ─────────────────────
        location ~* \.(js|wasm|css|png|jpg|jpeg|gif|ico|svg|epub|woff2?|stl)$ {
            expires off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # ── Landing SPA fallback ────────────────────────────
        # index.html must never be cached long: it carries the hashes of the
        # immutable JS/CSS/STL assets. A stale index.html = stale whole app.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
