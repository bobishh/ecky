name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-rust:
    name: Rust Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libsoup-3.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Prepare Runtime Resource Directories
        run: mkdir -p .dist/runtime/occt .dist/speech-runtime

      - name: Check Formatting
        run: cd src-tauri && cargo fmt --all -- --check

      # Local CAD-runtime cases require a packaged OCCT runner and FreeCAD,
      # neither of which exists on the generic Ubuntu image. Keep this job to
      # platform-independent workspace tests plus app integration smoke tests.
      # Compilation and Clippy still cover every Rust target and feature below.
      - name: Run Portable Rust Tests
        run: |
          cd src-tauri
          cargo test --workspace --exclude ecky_cad --all-targets --all-features --verbose
          for test_target in \
            agent_activity_journal \
            agent_language_source_contract \
            agy_provider_adapter \
            architecture_fitness \
            book_worked_examples_contract \
            boot_projection_architecture \
            cad_to_ecky_cli \
            campaign_project_open_architecture \
            capture_reconstruction_evidence \
            codex_app_server_projection \
            codex_takeover_persistence \
            component_package_contract \
            config_json_boundary \
            context_budget_audit \
            llm_eval_artifacts \
            llm_eval_compare_cli \
            provider_turn_intent
          do
            cargo test -p ecky_cad --test "$test_target" --all-features --verbose
          done

      - name: Run Clippy
        run: cd src-tauri && cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-frontend:
    name: Frontend Checks & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Frontend
        run: npm run typecheck

      - name: Run Frontend Unit Tests
        run: npm run test:unit

      - name: Run Frontend Component Tests
        run: npm run test:component

      - name: Build Frontend
        run: npm run build

  test-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e:ci

  test-landing:
    name: Landing Site (build + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sites/landing/package-lock.json

      - name: Install landing dependencies
        run: npm ci
        working-directory: sites/landing

      - name: Build landing
        run: npm run build
        working-directory: sites/landing

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: sites/landing

      - name: Run landing e2e
        run: npm run test:e2e
        working-directory: sites/landing

  test-docs:
    name: Docs Site (build + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build + serve docs, run e2e
        # The docs-site config builds the themed HTML + EPUB, stages a
        # production-mirroring directory, and serves it on port 4245.
        run: npx playwright test --config=sites/docs/playwright.config.ts

  build-tauri:
    name: Tauri Build Check
    needs: [test-rust, test-frontend, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libsoup-3.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm ci

      - name: Prepare Runtime Resource Directories
        run: mkdir -p .dist/runtime/occt .dist/speech-runtime

      - name: Build Frontend
        run: npm run build

      - name: Build Check
        run: cd src-tauri && cargo build --verbose
