[workspace]
members = [".", "crates/ecky-render", "crates/ecky-fem", "crates/ecky-accelerate-sparse"]
resolver = "2"

[package]
name = "ecky_cad"
version = "0.0.1" # x-release-please-version
description = "Prompt-driven 3D CAD designer"
authors = ["Bogdan"]
edition = "2021"
default-run = "ecky_cad"
autobins = false

[features]
default = []
cli = []
tooling = []

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
rfd = { version = "0.16.0", default-features = false, features = ["common-controls-v6"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ecky-render = { path = "crates/ecky-render" }
ecky-fem = { path = "crates/ecky-fem" }
specta = { version = "2.0.0-rc.22", features = ["derive"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }
notify = "8.2.0"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.38.0", features = ["blob", "bundled"] }
sha2 = "0.10.9"
base64 = "0.22.1"
rmp-serde = "1.3.0"
rand = "0.8"
qrcode = "0.14"
rcgen = { version = "0.13.2", features = ["x509-parser"] }
regex = "1.12.3"
rustpython-parser = "0.4.0"
rustpython-ast = { version = "0.4.0", features = ["visitor"] }
steel_core = { package = "steel-core", version = "0.8.2" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
mdns-sd = "0.13"
usvg = "0.40"
fontdb = "0.16.2"
rustybuzz = "0.12.1"
ttf-parser = "0.20.0"
portable-pty = "0.9.0"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
lexpr = "0.2.7"
csgrs = { version = "0.20.1", default-features = false, features = ["f64", "stl-io", "earcut", "offset"] }
spade = "2.15.1"
geo = "0.29.3"
fs2 = "0.4"
im-rc = "15.1.0"
meshopt = "0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
proptest = "1.6"
tower = { version = "0.5", features = ["util"] }

[lib]
name = "ecky_cad_lib"
path = "src/lib.rs"

[[bin]]
name = "ecky_cad"
path = "src/main.rs"

[[bin]]
name = "ecky"
path = "src/bin/ecky.rs"
required-features = ["cli"]

[[bin]]
name = "migrate_history_payloads"
path = "src/bin/migrate_history_payloads.rs"
required-features = ["tooling"]

[[bin]]
name = "cad_to_ecky"
path = "src/bin/cad_to_ecky.rs"
required-features = ["tooling"]

[[bin]]
name = "export_agent_prompt"
path = "src/bin/export_agent_prompt.rs"
required-features = ["tooling"]

[[bin]]
name = "export_contracts"
path = "src/bin/export_contracts.rs"
required-features = ["tooling"]

[[bin]]
name = "export_mcp_skill"
path = "src/bin/export_mcp_skill.rs"
required-features = ["tooling"]

[[bin]]
name = "lower_ecky_ir_to_freecad"
path = "src/bin/lower_ecky_ir_to_freecad.rs"
required-features = ["tooling"]

[[bin]]
name = "compare_llm_evals"
path = "src/bin/compare_llm_evals.rs"
required-features = ["tooling"]

[[bin]]
name = "pack_campaign_previews"
path = "src/bin/pack_campaign_previews.rs"
required-features = ["tooling"]

[[bin]]
name = "profile_history_projection"
path = "src/bin/profile_history_projection.rs"
required-features = ["tooling"]

[[bin]]
name = "render_ecky_ir_native_occt"
path = "src/bin/render_ecky_ir_native_occt.rs"
required-features = ["tooling"]

[[bin]]
name = "translate_legacy_python_to_ecky_ir"
path = "src/bin/translate_legacy_python_to_ecky_ir.rs"
required-features = ["tooling"]

[profile.dev.package.meshopt]
opt-level = 3

[profile.dev.package.ecky-fem]
opt-level = 3

[profile.dev.package.ecky-accelerate-sparse]
opt-level = 3
